{% extends "base.html" %}
{% block content %}
<h3>Edit Task</h3>
{% if errors %}
  <div class="alert alert-danger">
    <ul class="mb-0">
      {% for error in errors %}
        <li>{{ error }}</li>
      {% endfor %}
    </ul>
  </div>
{% endif %}
<form method="post">
  <div class="mb-3"><label>Title</label><input name="title" class="form-control" value="{{ form.title if form else task.title }}" required></div>
  <div class="mb-3"><label>Description</label><textarea name="description" class="form-control">{{ form.description if form else task.description }}</textarea></div>
  <div class="mb-3">
    <label>Priority</label>
    <select name="priority" class="form-select">
      {% set current_priority = form.priority if form else task.priority %}
      {% for p in ['Low','Medium','High'] %}
        <option {{ 'selected' if current_priority==p else '' }}>{{ p }}</option>
      {% endfor %}
    </select>
  </div>
  <div class="mb-3"><label>Due Date</label><input type="date" name="due_date" value="{{ form.due_date if form else task.due_date }}" class="form-control"></div>
  <div class="mb-3">
    <label>Status</label>
    <select name="status" class="form-select">
      {% set current_status = form.status if form else task.status %}
      {% for s in ['Pending','In Progress','Completed'] %}
        <option {{ 'selected' if current_status==s else '' }}>{{ s }}</option>
      {% endfor %}
    </select>
  </div>
  <button class="btn btn-success">Update</button>
</form>
{% endblock %}
